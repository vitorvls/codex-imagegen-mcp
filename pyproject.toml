[project]
name = "codex-imagegen-mcp"
version = "0.1.0"
description = "Local MCP server that lets Claude Code (or any MCP client) generate images through the official Codex CLI and your ChatGPT plan"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "codex", "image-generation", "claude-code", "chatgpt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
# Only for the "openai-api" backend. Billed separately from ChatGPT; not installed by default.
api = ["openai>=1.100"]

[project.scripts]
codex-imagegen-mcp = "codex_imagegen_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_imagegen_mcp"]
